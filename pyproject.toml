[project]
name = "gamma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hongyi", email = "develop@yifeistudio.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "requests>=2.34.2",
]

[project.scripts]
gamma = "gamma:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
